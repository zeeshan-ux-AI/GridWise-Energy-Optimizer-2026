name: Build, Test & Publish Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docker:
    name: Build, Test & Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies & Run 10-Case Optimization Validation
        run: |
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: gridwise-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Container Healthcheck & Optimization API
        run: |
          echo "Starting container..."
          docker run -d --name test-gridwise -p 8080:8080 -e PORT=8080 -e OPENAI_API_KEY=test_dummy_key gridwise-api:test
          sleep 5
          echo "Testing GET /health endpoint..."
          RESPONSE=$(curl -sf http://localhost:8080/health)
          echo "Health response: $RESPONSE"
          if [[ "$RESPONSE" != *'"status":"ok"'* ]]; then
            echo "Healthcheck failed!"
            docker logs test-gridwise
            exit 1
          fi
          echo "Healthcheck passed successfully!"
          
          echo "Testing POST /optimize-energy endpoint..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/optimize-energy \
            -H "Content-Type: application/json" \
            --data-binary @sample_request.json)
          echo "HTTP Status: $HTTP_STATUS"
          # Since dummy key is used, endpoint should execute MILP and return 200 or 503 (LLM unconfigured/invalid key), proving container server works
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 503 ]; then
            echo "Optimization test failed with unexpected HTTP status: $HTTP_STATUS"
            docker logs test-gridwise
            exit 1
          fi
          echo "Container Optimization API validated successfully!"
          docker stop test-gridwise

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build & Publish to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
